<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surprise 🎁</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1, #f093fb);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    min-height: 100vh;
    padding: 30px 15px;
    overflow-x: hidden;
  }
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .hearts {
    position: fixed; top:0; left:0;
    width:100%; height:100%;
    pointer-events:none; z-index:0; overflow:hidden;
  }
  .hearts span {
    position: absolute; bottom:-50px;
    animation: floatUp 12s linear infinite; opacity:0.7;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity:0; }
    10% { opacity:0.8; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity:0; }
  }
  .container {
    position: relative; z-index:1;
    max-width: 700px; margin: 0 auto;
  }
  .progress {
    background: rgba(255,255,255,0.4);
    border-radius: 30px;
    padding: 8px 15px;
    text-align: center;
    margin-bottom: 20px;
    font-weight: 600;
    color: #862e9c;
    font-size: 0.9rem;
    backdrop-filter: blur(10px);
  }
  .card {
    background: rgba(255,255,255,0.28);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 30px;
    border: 1px solid rgba(255,255,255,0.5);
    box-shadow: 0 25px 70px rgba(0,0,0,0.25);
    padding: 45px 25px;
    text-align: center;
    animation: fadeIn 1.5s ease;
  }
  @keyframes fadeIn {
    from { opacity:0; transform: translateY(40px); }
    to { opacity:1; transform: translateY(0); }
  }
  h1 {
    font-family: 'Dancing Script', cursive;
    font-size: 2.5rem;
    background: linear-gradient(45deg, #d6336c, #ae3ec9, #7048e8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 10px 0 20px;
  }
  p { color:#4a4a4a; font-size:1rem; line-height:1.8; margin:10px 0; }

  .gift-box {
    font-size: 100px;
    cursor: pointer;
    display: inline-block;
    animation: shake 2s infinite;
    margin: 20px 0;
    transition: transform 0.3s;
  }
  .gift-box:hover { transform: scale(1.1); }
  @keyframes shake {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-8deg); }
    75% { transform: rotate(8deg); }
  }

  .btn-group {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 25px;
  }
  .gift-btn, .music-btn, .share-btn {
    border: none;
    padding: 14px 28px;
    border-radius: 50px;
    font-size: 1rem;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    color: white;
  }
  .gift-btn {
    background: linear-gradient(45deg, #f06595, #cc5de8);
    box-shadow: 0 10px 25px rgba(204, 93, 232, 0.45);
  }
  .music-btn {
    background: linear-gradient(45deg, #ffd43b, #ff922b);
    box-shadow: 0 10px 25px rgba(255, 146, 43, 0.45);
  }
  .share-btn {
    background: linear-gradient(45deg, #25d366, #128c7e);
    box-shadow: 0 10px 25px rgba(37, 211, 102, 0.45);
  }
  .gift-btn:hover, .music-btn:hover, .share-btn:hover {
    transform: translateY(-3px) scale(1.05);
  }

  .hidden-msg {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.8s ease;
    font-family: 'Dancing Script', cursive;
    font-size: 1.5rem;
    color: #c2255c;
    margin-top: 15px;
  }
  .hidden-msg.show {
    max-height: 400px;
    margin-top: 25px;
  }

  .confetti {
    position: fixed;
    width: 12px; height: 12px;
    top: -20px;
    z-index: 999;
    animation: fall 4s linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  .nav-btns {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-top: 30px;
    flex-wrap: wrap;
  }
  .nav-btn {
    flex: 1;
    min-width: 130px;
    padding: 15px 20px;
    border-radius: 50px;
    border: none;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    color: white;
    transition: all 0.3s ease;
  }
  .back-btn {
    background: linear-gradient(45deg, #868e96, #495057);
    box-shadow: 0 8px 20px rgba(73, 80, 87, 0.4);
  }
  .home-btn {
    background: linear-gradient(45deg, #4dabf7, #228be6);
    box-shadow: 0 8px 20px rgba(34, 139, 230, 0.4);
  }
  .nav-btn:hover { transform: translateY(-3px) scale(1.03); }

  @media (max-width: 600px) {
    .card { padding: 35px 18px; }
    h1 { font-size: 2rem; }
    .gift-box { font-size: 80px; }
  }
</style>
</head>
<body>

<div class="hearts" id="hearts"></div>

<div class="container">
  <div class="progress">📖 Page 5 of 5 — Final Surprise</div>

  <div class="card">
    <h1>🎁 Your Special Surprise 🎁</h1>
    <p>Gift box pe click karo — surprise khulega!</p>

    <div class="gift-box" onclick="openGift()">🎁</div>

    <div class="hidden-msg" id="giftMsg">
      You are the best Aapi in the world! 💗<br>
      Stay happy, stay blessed, stay amazing! 🌟<br>
      <span style="font-size:1.2rem;">Happy Birthday! 🎂🎉</span>
    </div>

    <div class="btn-group">
      <button class="gift-btn" onclick="openGift()">🎁 Open Gift</button>
      <button class="music-btn" onclick="toggleMusic()" id="musicBtn">🎵 Play Music</button>
      <button class="share-btn" onclick="shareWish()">💌 Share</button>
    </div>

    <div class="nav-btns">
      <button class="nav-btn back-btn" onclick="window.location.href='reasons.html'">⬅️ Back</button>
      <button class="nav-btn home-btn" onclick="window.location.href='index.html'">🏠 Home</button>
    </div>
  </div>
</div>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
  const heartsContainer = document.getElementById('hearts');
  const emojis = ['💗','🌸','🦋','💕','🌷','✨','🎀','🧸'];
  for (let i = 0; i < 25; i++) {
    const span = document.createElement('span');
    span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    span.style.left = Math.random() * 100 + '%';
    span.style.animationDelay = Math.random() * 12 + 's';
    span.style.animationDuration = (9 + Math.random() * 8) + 's';
    span.style.fontSize = (14 + Math.random() * 24) + 'px';
    heartsContainer.appendChild(span);
  }

  function openGift() {
    document.getElementById('giftMsg').classList.add('show');
    createConfetti();
  }

  function createConfetti() {
    const colors = ['#f06595','#cc5de8','#ffd43b','#69db7c','#4dabf7','#ff6b6b','#f783ac'];
    for (let i = 0; i < 120; i++) {
      const conf = document.createElement('div');
      conf.className = 'confetti';
      conf.style.left = Math.random() * 100 + 'vw';
      conf.style.background = colors[Math.floor(Math.random() * colors.length)];
      conf.style.animationDelay = Math.random() * 0.8 + 's';
      conf.style.animationDuration = (3 + Math.random() * 2) + 's';
      conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      conf.style.width = (8 + Math.random() * 8) + 'px';
      conf.style.height = conf.style.width;
      document.body.appendChild(conf);
      setTimeout(() => conf.remove(), 5000);
    }
  }

  const music = document.getElementById('bgMusic');
  const musicBtn = document.getElementById('musicBtn');
  let isPlaying = false;

  function toggleMusic() {
    if (isPlaying) {
      music.pause();
      musicBtn.textContent = '🎵 Play Music';
      isPlaying = false;
    } else {
      music.play().then(() => {
        musicBtn.textContent = '⏸️ Pause Music';
        isPlaying = true;
      }).catch(e => {
        alert('Music file nahi mili. music.mp3 upload karo GitHub pe.');
      });
    }
  }

  function shareWish() {
    const text = encodeURIComponent("Happy Birthday meri pyari Aapi 💗🎂 — Dekho yeh surprise: " + window.location.href);
    window.open("https://wa.me/?text=" + text, "_blank");
  }

  setTimeout(createConfetti, 1500);
</script>

</body>
</html>
