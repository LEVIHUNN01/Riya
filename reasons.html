<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reasons 💭</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1, #f093fb);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    min-height: 100vh;
    padding: 30px 15px;
    overflow-x: hidden;
  }
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .hearts {
    position: fixed; top:0; left:0;
    width:100%; height:100%;
    pointer-events:none; z-index:0; overflow:hidden;
  }
  .hearts span {
    position: absolute; bottom:-50px;
    animation: floatUp 12s linear infinite; opacity:0.7;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity:0; }
    10% { opacity:0.8; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity:0; }
  }
  .container {
    position: relative; z-index:1;
    max-width: 700px; margin: 0 auto;
  }
  .progress {
    background: rgba(255,255,255,0.4);
    border-radius: 30px;
    padding: 8px 15px;
    text-align: center;
    margin-bottom: 20px;
    font-weight: 600;
    color: #862e9c;
    font-size: 0.9rem;
    backdrop-filter: blur(10px);
  }
  .card {
    background: rgba(255,255,255,0.28);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 30px;
    border: 1px solid rgba(255,255,255,0.5);
    box-shadow: 0 25px 70px rgba(0,0,0,0.25);
    padding: 45px 25px;
    text-align: center;
    animation: fadeIn 1.5s ease;
  }
  @keyframes fadeIn {
    from { opacity:0; transform: translateY(40px); }
    to { opacity:1; transform: translateY(0); }
  }
  h1 {
    font-family: 'Dancing Script', cursive;
    font-size: 2.5rem;
    background: linear-gradient(45deg, #d6336c, #ae3ec9, #7048e8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 10px 0 20px;
  }
  p { color:#4a4a4a; font-size:1rem; line-height:1.8; margin:10px 0; }
  .reasons {
    display: flex; justify-content: center;
    gap: 12px; flex-wrap: wrap;
    margin: 25px 0;
  }
  .flip-card {
    width: 140px; height: 140px;
    perspective: 1000px;
    cursor: pointer;
  }
  .flip-inner {
    position: relative;
    width: 100%; height: 100%;
    transition: transform 0.8s;
    transform-style: preserve-3d;
  }
  .flip-card.flipped .flip-inner {
    transform: rotateY(180deg);
  }
  .flip-front, .flip-back {
    position: absolute;
    width: 100%; height: 100%;
    backface-visibility: hidden;
    border-radius: 18px;
    display: flex; align-items:center; justify-content:center;
    padding: 10px;
    text-align: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  }
  .flip-front {
    background: linear-gradient(135deg, #f06595, #cc5de8);
    color: white;
    font-size: 2.2rem;
  }
  .flip-back {
    background: #fff;
    color: #c2255c;
    transform: rotateY(180deg);
    font-family: 'Dancing Script', cursive;
    font-size: 1.1rem;
    line-height: 1.4;
  }
  .nav-btns {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-top: 30px;
    flex-wrap: wrap;
  }
  .nav-btn {
    flex: 1;
    min-width: 130px;
    padding: 15px 20px;
    border-radius: 50px;
    border: none;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    color: white;
    transition: all 0.3s ease;
  }
  .back-btn {
    background: linear-gradient(45deg, #868e96, #495057);
    box-shadow: 0 8px 20px rgba(73, 80, 87, 0.4);
  }
  .next-btn {
    background: linear-gradient(45deg, #f06595, #cc5de8);
    box-shadow: 0 8px 25px rgba(204, 93, 232, 0.5);
  }
  .nav-btn:hover { transform: translateY(-3px) scale(1.03); }
  @media (max-width: 600px) {
    .card { padding: 35px 18px; }
    h1 { font-size: 2rem; }
    .flip-card { width: 120px; height: 120px; }
    .flip-back { font-size: 1rem; }
  }
</style>
</head>
<body>

<div class="hearts" id="hearts"></div>

<div class="container">
  <div class="progress">📖 Page 4 of 5 — Reasons</div>

  <div class="card">
    <h1>💭 Why You're Special 💭</h1>
    <p>Har card pe click karo!</p>
    <div class="reasons">
      <div class="flip-card" onclick="this.classList.toggle('flipped')">
        <div class="flip-inner">
          <div class="flip-front">💗</div>
          <div class="flip-back">Aap hamesha meri baat sunti ho</div>
        </div>
      </div>
      <div class="flip-card" onclick="this.classList.toggle('flipped')">
        <div class="flip-inner">
          <div class="flip-front">🌸</div>
          <div class="flip-back">Aapki smile sabse pyari hai</div>
        </div>
      </div>
      <div class="flip-card" onclick="this.classList.toggle('flipped')">
        <div class="flip-inner">
          <div class="flip-front">🦋</div>
          <div class="flip-back">Aap meri best friend ho</div>
        </div>
      </div>
      <div class="flip-card" onclick="this.classList.toggle('flipped')">
        <div class="flip-inner">
          <div class="flip-front">🌷</div>
          <div class="flip-back">Aap hamesha mere saath ho</div>
        </div>
      </div>
      <div class="flip-card" onclick="this.classList.toggle('flipped')">
        <div class="flip-inner">
          <div class="flip-front">✨</div>
          <div class="flip-back">Aap meri inspiration ho</div>
        </div>
      </div>
      <div class="flip-card" onclick="this.classList.toggle('flipped')">
        <div class="flip-inner">
          <div class="flip-front">🎀</div>
          <div class="flip-back">Aap sabse caring ho</div>
        </div>
      </div>
    </div>

    <div class="nav-btns">
      <button class="nav-btn back-btn" onclick="window.location.href='letter.html'">⬅️ Back</button>
      <button class="nav-btn next-btn" onclick="window.location.href='surprise.html'">Next ➡️</button>
    </div>
  </div>
</div>

<script>
  const heartsContainer = document.getElementById('hearts');
  const emojis = ['💗','🌸','🦋','💕','🌷','✨','🎀','🧸'];
  for (let i = 0; i < 25; i++) {
    const span = document.createElement('span');
    span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    span.style.left = Math.random() * 100 + '%';
    span.style.animationDelay = Math.random() * 12 + 's';
    span.style.animationDuration = (9 + Math.random() * 8) + 's';
    span.style.fontSize = (14 + Math.random() * 24) + 'px';
    heartsContainer.appendChild(span);
  }
</script>

</body>
</html>
