<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1, #f093fb);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
  }
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .hearts {
    position: fixed; top:0; left:0;
    width:100%; height:100%;
    pointer-events:none; z-index:0; overflow:hidden;
  }
  .hearts span {
    position: absolute; bottom:-50px;
    animation: floatUp 12s linear infinite; opacity:0.7;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity:0; }
    10% { opacity:0.8; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity:0; }
  }
  .card {
    position: relative; z-index:1;
    max-width: 650px;
    width: 100%;
    background: rgba(255,255,255,0.28);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 30px;
    border: 1px solid rgba(255,255,255,0.5);
    box-shadow: 0 25px 70px rgba(0,0,0,0.25);
    padding: 60px 30px;
    text-align: center;
    animation: fadeIn 1.5s ease;
  }
  @keyframes fadeIn {
    from { opacity:0; transform: translateY(40px); }
    to { opacity:1; transform: translateY(0); }
  }
  .cake {
    font-size: 80px;
    animation: bounce 2s infinite;
    display: inline-block;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
  }
  h1 {
    font-family: 'Dancing Script', cursive;
    font-size: 3rem;
    background: linear-gradient(45deg, #d6336c, #ae3ec9, #7048e8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 20px 0;
    line-height: 1.2;
  }
  p {
    color: #4a4a4a;
    font-size: 1.1rem;
    line-height: 1.8;
    margin: 15px 0;
  }
  .tap-text {
    font-family: 'Dancing Script', cursive;
    font-size: 1.5rem;
    color: #c2255c;
    margin-top: 30px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }
  .start-btn {
    margin-top: 30px;
    background: linear-gradient(45deg, #f06595, #cc5de8);
    color: white;
    border: none;
    padding: 18px 50px;
    border-radius: 50px;
    font-size: 1.2rem;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 15px 35px rgba(204, 93, 232, 0.5);
    transition: all 0.3s ease;
    animation: glow 2s infinite;
  }
  @keyframes glow {
    0%, 100% { box-shadow: 0 15px 35px rgba(204, 93, 232, 0.5); }
    50% { box-shadow: 0 15px 50px rgba(204, 93, 232, 0.9); }
  }
  .start-btn:hover {
    transform: translateY(-5px) scale(1.08);
  }
  @media (max-width: 600px) {
    .card { padding: 45px 22px; }
    h1 { font-size: 2.2rem; }
    p { font-size: 1rem; }
    .cake { font-size: 65px; }
    .start-btn { padding: 16px 40px; font-size: 1.1rem; }
  }
</style>
</head>
<body>

<div class="hearts" id="hearts"></div>

<div class="card">
  <div class="cake">🎂</div>
  <h1>Ek Special Surprise<br>Hai Aapke Liye 💗</h1>
  <p>Yeh ek chhota sa tohfa hai —<br>sirf aapke liye banaya gaya. 🌸</p>
  <p>Ready ho? Chalo shuru karein! ✨</p>

  <div class="tap-text">👇 Tap to Begin 👇</div>

  <button class="start-btn" onclick="window.location.href='birthday.html'">
    🎁 Start Surprise
  </button>
</div>

<script>
  const heartsContainer = document.getElementById('hearts');
  const emojis = ['💗','🌸','🦋','💕','🌷','✨','🎀','🧸','💖','🌺'];
  for (let i = 0; i < 30; i++) {
    const span = document.createElement('span');
    span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    span.style.left = Math.random() * 100 + '%';
    span.style.animationDelay = Math.random() * 12 + 's';
    span.style.animationDuration = (9 + Math.random() * 8) + 's';
    span.style.fontSize = (14 + Math.random() * 24) + 'px';
    heartsContainer.appendChild(span);
  }
</script>

</body>
</html>
